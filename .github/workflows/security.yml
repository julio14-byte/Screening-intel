name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 13 * * 1"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn tsc --noEmit
      - run: yarn lint
      - run: yarn verify:security
      - name: Dependencias de producción (alta o crítica bloquea)
        # Yarn 1 devuelve una máscara de bits (4 = moderada, 8 = alta, 16 = crítica) aunque se pase --level.
        run: |
          set +e
          yarn audit --groups dependencies
          code=$?
          if [ $((code & 24)) -ne 0 ]; then exit 1; fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
